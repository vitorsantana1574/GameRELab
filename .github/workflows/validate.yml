name: Validar GameRELab

on: [push, pull_request]

permissions:
  contents: read

jobs:
  fabric:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Compilar mod Fabric
        run: gradle --no-daemon --console=plain -p projects/minecraft build
      - uses: actions/upload-artifact@v4
        with:
          name: gamerelab-fabric-${{ runner.os }}
          path: projects/minecraft/build/libs/*.jar
          if-no-files-found: error
      - name: Verificar inicialização do mod no cliente
        if: runner.os == 'Linux'
        shell: bash
        run: |
          timeout 180s xvfb-run -a gradle --no-daemon --console=plain -p projects/minecraft runClient > client.log 2>&1 &
          client=$!
          trap 'kill "$client" 2>/dev/null || true' EXIT
          while kill -0 "$client" 2>/dev/null; do
            if grep -qF 'GameRELab Fabric carregado' client.log; then
              exit 0
            fi
            sleep 2
          done
          if ! grep -qF 'GameRELab Fabric carregado' client.log; then
            tail -n 100 client.log
            exit 1
          fi

  mcp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar o protocolo do servidor MCP local
        run: python tests/check_mcp.py
