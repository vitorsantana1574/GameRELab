name: Validar GameRELab

on: [push, pull_request]

permissions:
  contents: read

jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Compilar mod Fabric
        run: gradle --no-daemon --console=plain -p projects/minecraft build
      - uses: actions/upload-artifact@v4
        with:
          name: gamerelab-fabric
          path: projects/minecraft/build/libs/*.jar
          if-no-files-found: error

  mcp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar o protocolo do servidor MCP local
        run: python tests/check_mcp.py
